name: Publish phone-installable APK
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/publish-beta-apk.yml'
jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - uses: android-actions/setup-android@v4
      - name: Install Android SDK 35
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - name: Build APK
        run: gradle --no-daemon :app:assembleDebug
      - name: Publish APK as one-tap download
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk PokemonBinder-v0.4-Scanner-Fix.apk
          gh release create v0.4.0-scanner-fix PokemonBinder-v0.4-Scanner-Fix.apk \
            --title 'Pokémon Binder 0.4 - better live scanner' \
            --notes 'Android test APK. Better name matching; manual checklist and prices preserved.' \
            --prerelease --target "$GITHUB_SHA"
